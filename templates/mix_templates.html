{{define "content"}}
<div class="stack">
  {{template "mixesHeading" "saved"}}
  <div class="row is-items-center is-wrap">
    <p class="text-muted">Mix settings you keep, to generate again with one click.</p>
    <button type="button" class="btn btn-primary btn-sm push"
      hx-get="/mix-templates/new" hx-target="#modal-root" hx-swap="innerHTML">New saved mix</button>
  </div>

  <div id="mix-templates-list" hx-get="/mix-templates/list" hx-trigger="load" hx-swap="innerHTML"></div>
</div>
{{end}}
