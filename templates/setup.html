{{define "content"}}
<div class="container stack" id="setup-wizard">
  <h1>Plex Server</h1>

  <!-- Step 2 becomes current once the library <select> has loaded into
       #libraries (script below). -->
  <nav class="breadcrumbs" aria-label="Steps">
    <span class="breadcrumb-item is-current" id="setup-step-1">1. Select server</span>
    <span class="breadcrumb-item" id="setup-step-2">2. Choose library</span>
  </nav>

  <section class="panel stack">
    <div class="panel-header">Plex Server</div>
    <p class="text-muted">Connect Playlist Lab to your Plex Media Server and choose a music library.</p>
    <form class="stack" hx-post="/servers/select" hx-target="body" hx-swap="outerHTML">
      <div class="field">
        <label class="label" for="setup-server">Server</label>
        <select id="setup-server" name="server" class="select" hx-get="/setup/libraries" hx-target="#libraries" hx-trigger="change"
          hx-on::after:request="document.getElementById('setup-step-1').classList.remove('is-current'); document.getElementById('setup-step-2').classList.add('is-current')">
          <option value="">Select a server...</option>
          {{range .Servers}}
          <option value="{{.ClientIdentifier}}">{{.Name}}</option>
          {{end}}
        </select>
      </div>
      <div id="libraries" class="field"></div>
      <div class="cluster">
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </section>
</div>
{{end}}
