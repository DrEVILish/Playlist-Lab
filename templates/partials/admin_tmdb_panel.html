{{define "partials/admin_tmdb_panel.html"}}
<form hx-post="/admin/tmdb/config" hx-target="#settings-panel-admin-tmdb" hx-swap="innerHTML">
  <div class="settings-field-group">
    <div class="settings-field">
      <label class="settings-label" for="tmdb-api-key">API Key</label>
      <input id="tmdb-api-key" type="password" name="apiKey" class="settings-input" value="{{.APIKey}}" placeholder="Settings > API in your TMDb account" autocomplete="off">
    </div>
  </div>
  {{if .Notice}}<div class="settings-alert settings-alert--success">{{.Notice}}</div>{{end}}
  {{if .Error}}<div class="settings-alert settings-alert--error">{{.Error}}</div>{{end}}
  <div class="settings-actions">
    <button type="submit" class="btn btn-primary">Save TMDb Config</button>
  </div>
</form>
{{end}}
