{{define "partials/cross_import_playlists.html"}}
{{if not .Playlists}}
<div class="empty-state">
  <div class="empty-state-title">No playlists found</div>
  <div class="empty-state-hint">No playlists found on your Plex server.</div>
</div>
{{else}}
<div class="list">
  {{range $i, $p := .Playlists}}
  <form class="list-item row is-items-center" hx-post="/cross-import/match" hx-target="#cross-import-progress" hx-swap="innerHTML">
    <input type="hidden" name="playlistId" value="{{$p.ID}}">
    {{if $p.CoverURL}}
    <img src="{{$p.CoverURL}}" alt="{{$p.Name}}">
    {{else}}
    <div class="mono">{{add $i 1}}</div>
    {{end}}
    <div class="stack stack-sm">
      <div class="list-item-title">{{$p.Name}}</div>
      <div class="list-item-meta">{{$p.TrackCount}} tracks</div>
    </div>
    <button type="submit" class="btn btn-primary btn-sm">Import to YouTube</button>
  </form>
  {{end}}
</div>
{{end}}
{{end}}
