{{define "partials/cross_import_candidates.html"}}
{{if not .Candidates}}
<p>No candidates found.</p>
{{else}}
<div>
  {{range .Candidates}}
  <div>
    <div>
      <div>{{.TargetTitle}}</div>
      <div>{{.TargetArtist}}</div>
    </div>
    <span class="badge{{if ge .Confidence 80.0}} badge-success{{else if ge .Confidence 50.0}} badge-warning{{else}} badge-danger{{end}}">{{printf "%.0f" .Confidence}}%</span>
    <form hx-post="/cross-import/review/{{$.SessionID}}/track/{{$.Index}}/select" hx-target="#cross-import-match-status" hx-swap="outerHTML">
      <input type="hidden" name="targetTrackId" value="{{.TargetTrackID}}">
      <input type="hidden" name="targetTitle" value="{{.TargetTitle}}">
      <input type="hidden" name="targetArtist" value="{{.TargetArtist}}">
      <button type="submit" class="btn btn-primary btn-sm">Use this</button>
    </form>
  </div>
  {{end}}
</div>
{{end}}
{{end}}
