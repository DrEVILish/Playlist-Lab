{{define "partials/admin_tvdb_panel.html"}}
<form hx-post="/admin/tvdb/config" hx-target="#settings-panel-admin-tvdb" hx-swap="innerHTML">
  <div class="settings-field-group">
    <div class="settings-field">
      <label class="settings-label" for="tvdb-api-key">API Key</label>
      <input id="tvdb-api-key" type="password" name="apiKey" class="settings-input" value="{{.APIKey}}" placeholder="thetvdb.com/api-information" autocomplete="off">
    </div>
  </div>
  {{if .Error}}<div class="settings-alert settings-alert--error">{{.Error}}</div>{{end}}
  <div class="settings-actions">
    <button type="submit" class="btn btn-primary">Save TVDb Config</button>
  </div>
</form>
{{end}}
