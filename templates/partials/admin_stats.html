{{define "partials/admin_stats.html"}}
<div class="admin-stats-grid">
  <div class="card admin-stat-card"><h3>Total Users</h3><p class="admin-stat-value">{{.Stats.TotalUsers}}</p></div>
  <div class="card admin-stat-card"><h3>Active Users (30d)</h3><p class="admin-stat-value">{{.Stats.ActiveUsers}}</p></div>
  <div class="card admin-stat-card"><h3 title="Every playlist ever imported/tracked through Playlist Lab, across all users - not just those currently live on Plex">Playlists Tracked (All-Time)</h3><p class="admin-stat-value">{{.Stats.TotalPlaylists}}</p></div>
  <div class="card admin-stat-card"><h3>Missing Tracks</h3><p class="admin-stat-value">{{.Stats.TotalMissing}}</p></div>
</div>
{{end}}
