{{define "partials/auth_pending.html"}}
<div class="panel stack" hx-post="/auth/poll" hx-vals='{"pinId": "{{.PinID}}", "code": "{{.Code}}"}' hx-trigger="load delay:2s" hx-target="#auth-status" hx-swap="innerHTML">
  <span class="spinner" aria-label="Waiting for Plex sign-in"></span>
  {{if .Error}}<p class="alert alert-danger">{{.Error}}</p>{{end}}
  <p>A sign-in window has opened. Please sign in to Plex and authorize this app.</p>
  <p class="readout readout-lg">{{.Code}}</p>
  <p class="field-hint">Enter this code if prompted</p>
  <p class="field-hint">No sign-in window? <a href="{{.AuthURL}}" target="_blank" rel="noopener">Open the Plex sign-in page</a></p>
</div>
{{if .OpenPopup}}<script>window.open("{{.AuthURL}}", "_blank", "noopener");</script>{{end}}
{{end}}
