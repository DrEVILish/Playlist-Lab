{{define "partials/admin_trakt_panel.html"}}
<form hx-post="/admin/trakt/config" hx-target="#settings-panel-admin-trakt" hx-swap="innerHTML">
  <div class="stack">
    <div class="field">
      <label class="label" for="trakt-api-key">Client ID</label>
      <input id="trakt-api-key" type="password" name="apiKey" class="input" placeholder="{{if .APIKey}}Saved. Paste a new Client ID to replace it{{else}}trakt.tv/oauth/applications{{end}}" autocomplete="off">
    </div>
  </div>
  {{if .Notice}}<div class="alert alert-success">{{.Notice}}</div>{{end}}
  {{if .Error}}<div class="alert alert-danger">{{.Error}}</div>{{end}}
  <div class="cluster">
    <button type="submit" class="btn btn-primary btn-sm">Save Trakt Config</button>
    {{if .APIKey}}<button type="button" class="btn btn-tertiary btn-sm" hx-post="/admin/trakt/config" hx-vals='{"clear":"1"}' hx-target="#settings-panel-admin-trakt" hx-swap="innerHTML" hx-confirm="Remove the saved Client ID?">Remove Client ID</button>{{end}}
  </div>
</form>
{{end}}
