{{/* Per-field autosave indicator (DESIGN.md §11.4/§8.12) - swapped via
     hx-swap="innerHTML" into a field's static <span id="...-status">
     wrapper, so the wrapper keeps its id and stays a stable hx-target. */}}
{{define "partials/settings_field_status.html"}}
{{if .Error}}<span class="status status-error" role="alert">{{.Error}}</span>{{else}}<span class="status status-ok" aria-live="polite">Saved</span>{{end}}
{{end}}
