{{define "partials/oauth_services.html"}}
{{if not .Services}}
<p class="field-hint">No external services available.</p>
{{else}}
<!-- Also used by the Cross-Import page (cross_import.html). -->
<ul class="list settings-services-list">
  {{range .Services}}
  <li class="list-item row is-items-center">
    <strong>{{.Name}}</strong>
    <span class="status{{if .Connected}} status-ok{{else}} status-idle{{end}}">{{if .Connected}}Connected{{else}}Not connected{{end}}</span>
    <span class="push">
      {{if .Connected}}
      <!-- Destructive, so it confirms first (hx-confirm -> the shared themed
           confirm dialog, DESIGN.md §8.11/§11.4). -->
      <button type="button" class="btn btn-danger btn-sm" hx-delete="/cross-import/oauth/{{.ID}}" hx-target="closest .settings-services-list" hx-swap="outerHTML"
        hx-confirm="Disconnect {{.Name}}? You'll need to re-authenticate to use {{.Name}} in Cross Import again."
        hx-on::after:request="if(event.detail.xhr.status<400) window.location.reload()">Disconnect</button>
      {{else}}
      <a class="btn btn-primary btn-sm" href="/cross-import/oauth/{{.ID}}">Connect</a>
      {{end}}
    </span>
  </li>
  {{end}}
</ul>
{{end}}
{{end}}
