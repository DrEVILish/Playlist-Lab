{{define "partials/libraries_select.html"}}
{{if .Error}}
<div class="settings-alert settings-alert--error">{{.Error}}</div>
{{else}}
<label class="settings-label">Music library
  <select name="library" class="settings-select">
    <option value="">Select a library...</option>
    {{range .Libraries}}
    <option value="{{.Value}}">{{.Name}}</option>
    {{end}}
  </select>
</label>
{{end}}
{{end}}
