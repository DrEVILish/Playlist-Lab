{{define "content"}}
<section class="hero container">
  <h1>Playlist Lab</h1>
  {{if .Expired}}<p class="alert alert-warning">Your Plex sign-in has expired, so Playlist Lab can't reach your servers. Sign in again; your playlists, servers and settings are kept.</p>
  {{else}}<p>Sign in with your Plex account to continue</p>{{end}}
  <div class="stack">
    <div><button class="btn btn-primary" hx-post="/auth/start" hx-target="#auth-status" hx-swap="innerHTML">Sign in with Plex</button></div>
    <div id="auth-status"></div>
  </div>
</section>
{{end}}
