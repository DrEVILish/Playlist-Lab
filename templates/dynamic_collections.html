{{define "content"}}
<link rel="stylesheet" href="/static/css/components/DataTable.css">
<link rel="stylesheet" href="/static/css/pages/CollectionsPage.css">
<div class="collections page-container">
  <div class="page-header">
    <h1 class="page-title">Dynamic Collections</h1>
    <button type="button" class="btn btn-secondary btn-small"
      hx-get="/collections/presets" hx-target="#modal-root" hx-swap="innerHTML">
      Browse Presets
    </button>
    <button type="button" class="btn btn-primary btn-small"
      hx-get="/dynamic-collections/new" hx-target="#modal-root" hx-swap="innerHTML">
      New Set
    </button>
  </div>
  <p class="field-hint">Kometa-style dynamic collections: each set below expands into one real Collection per distinct genre/decade/year/etc. found in the chosen library - see the <a href="/collections">Collections</a> page for the collections it creates.</p>
  <div id="dynamic-collections-list" hx-get="/dynamic-collections/list" hx-trigger="load, dynamic-collections-changed from:body" hx-swap="innerHTML"></div>
</div>
{{end}}
