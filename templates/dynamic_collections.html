{{define "content"}}
<div class="stack">
  <header class="page-heading">
    <div class="page-heading-main">
      <h1>Collections</h1>
      <p class="text-muted">A dynamic set makes one collection per genre, decade, year or other value found in a library, and keeps them up to date.</p>
    </div>
    <div class="page-heading-actions">
      <button type="button" class="btn btn-secondary btn-sm"
        hx-get="/collections/presets" hx-target="#modal-root" hx-swap="innerHTML">Browse presets</button>
      <button type="button" class="btn btn-primary btn-sm"
        hx-get="/dynamic-collections/new" hx-target="#modal-root" hx-swap="innerHTML">New dynamic set</button>
    </div>
  </header>
  {{template "collectionsHeading" "dynamic"}}
  <div id="dynamic-collections-list" hx-get="/dynamic-collections/list" hx-trigger="load, dynamic-collections-changed from:body" hx-swap="innerHTML"></div>
</div>
{{end}}
